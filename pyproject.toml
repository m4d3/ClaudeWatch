[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claudewatch"
version = "0.1.0"
description = "Read-only terminal viewer for local Claude Code session activity"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["claude", "claude-code", "agents", "subagents", "terminal", "viewer", "transcripts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/m4d3/ClaudeWatch"
Issues = "https://github.com/m4d3/ClaudeWatch/issues"
Changelog = "https://github.com/m4d3/ClaudeWatch/blob/main/CHANGELOG.md"

[project.scripts]
claudewatch = "claudewatch:cli"

[tool.setuptools]
py-modules = ["claudewatch"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
